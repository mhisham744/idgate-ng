<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./gate.svg" />
    <!-- maximum-scale=1 + user-scalable=no stops iOS Safari/WKWebView from
         auto-zooming when a sub-16px input is focused (and never zooming back
         out). This app is a fixed, native-style layout, so page zoom is off. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151f42" />
    <title>IDGate — Identity Gate</title>

    <!-- PWA / Add to Home Screen (iOS + Android). Icons are PNGs (iOS ignores
         SVG touch icons); paths are relative so they resolve under the GitHub
         Pages project subpath. No-op inside the Capacitor native shell. -->
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IDGate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Freshness guard (web only): GitHub Pages caches index.html, so a phone can
      // keep showing an old bundle. On load we fetch version.json uncached; if a
      // newer build is live, reload with a cache-busting ?v= so Safari must refetch
      // the HTML (a plain reload can still hit the cached copy). sessionStorage guard
      // prevents any loop. No-op under Capacitor (file://) and offline.
      ;(function () {
        try {
          if (location.protocol === 'file:') return
          var CURRENT = '__BUILD_ID__'
          var KEY = 'idgate.reloadedFor'
          fetch('./version.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (v) {
              if (!v || !v.buildId || v.buildId === CURRENT) return
              if (sessionStorage.getItem(KEY) === v.buildId) return
              sessionStorage.setItem(KEY, v.buildId)
              var u = new URL(location.href)
              u.searchParams.set('v', v.buildId)
              location.replace(u.href)
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <script>
      // Apply the persisted appearance before first paint to avoid a light flash.
      try {
        var raw = localStorage.getItem('idgate.theme')
        var theme = raw ? JSON.parse(raw).state.theme : 'light'
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#0f172a')
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
